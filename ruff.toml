    "ANN001",
    "ARG",
    "ASYNC",
    "B007",
    "C4",
    "D2",
    "D4",
    "E",
    "FAST",
    "FBT003",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "N",
    "PIE",
    "PT",
    "RET501",
    "RUF",
    "SLF",
    "T20",
    "UP",
    "W",
