[project]
name = "ez-pil"
description = "An easy-to-use extension for PIL to edit and modify images."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["easy-pil", "ez-pil", "pillow", "pil"]
authors = [
    { name = "tibue99" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["dependencies", "optional-dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}
version = {attr = "ez_pil.__version__"}

[tool.setuptools.dynamic.optional-dependencies]
docs = {file = "docs/requirements.txt"}

[project.urls]
GitHub = "https://github.com/CookieAppTeam/ez-pil"
Documentation = "https://ez-pil.readthedocs.io/en/latest/"

[build-system]
requires = ["setuptools>=62.6", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
